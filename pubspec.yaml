name: meeting_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  go_router: ^15.0.0
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.2.3
  fluttertoast: ^8.2.6
  fancy_password_field: ^2.0.7
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  dropdown_button2: ^2.3.9
  dio: ^5.6.0
  font_awesome_flutter: ^10.7.0
  flutter_expandable_fab: ^2.2.0
  intl: ^0.20.2
  zego_uikit_prebuilt_video_conference: ^2.8.3
  zego_uikit_prebuilt_call: ^4.12.11
  file_picker: ^8.3.7
  win32: ^5.5.1
  ffi: ^2.1.0
  supabase_flutter: ^2.9.0
  dartz: ^0.10.1
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.1.1
  build_runner: ^2.4.9

flutter:

  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/

  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Bold.ttf
        - asset: fonts/Gilroy-ExtraBold.ttf
        - asset: fonts/Gilroy-Light.ttf
        - asset: fonts/Gilroy-Medium.ttf

flutter_native_splash:
  color: "#2C2B2B"
  image: assets/logos/mainLogo.png

  android_12:
    image: assets/logos/mainLogo.png
    color: "#2C2B2B"
